; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
    nodemcuv2
    pico32
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
monitor_speed = 115200
build_flags =

; iotsa_v4 (ESP8266 nodemcuv2) -- the main target Jack has hardware for. 4m1m
; (1MB LittleFS -- only the two small .cfg files live there) leaves room for the
; OTA scratch partition; 4m3m had none. HTTP only (no HTTPS build flag).
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld

; pico32 -- an ESP32 device Jack built around this app.
[env:pico32]
extends = pico32
